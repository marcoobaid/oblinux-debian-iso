---

# New_York is only the offline fallback. With networking, Calamares replaces
# it with the location-aware result returned by KDE's Calamares GeoIP service.
region:                     "America"
zone:                       "New_York"

geoip:
    style:    "json"
    url:      "https://geoip.kde.org/v1/calamares"
    selector: ""
